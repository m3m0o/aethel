[package]
name = "aethel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "IPv6 AnyIP HTTP automation CLI"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
