[package]
name = "aethel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "IPv6 AnyIP HTTP automation CLI"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
netlink-packet-route = "0.25"
rtnetlink = "0.18"
reqwest = { version = "0.12", default-features = false }
socket2 = "0.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.47", features = ["net", "process", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
